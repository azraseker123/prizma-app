name: PRIZMA 2 typecheck
on:
  push:
    branches:
      - feature/prizma-2-full-redesign-20261122
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
